name: the_lounge
description: A new Flutter project.
publish_to: 'none'

version: 0.3.4+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  google_fonts: ^6.2.1
  youtube_player_iframe: ^5.2.0
  shared_preferences: ^2.2.3
  animations: ^2.2.0
  flutter_animate: ^4.5.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.0
  sentry_flutter: ^8.13.0
  cached_network_image: ^3.4.1
  file_picker: ^11.0.3
  share_plus: ^13.3.0
  web: ^1.0.0
  fl_chart: ^1.2.0

  # Reusable motion/FX/UI/utility toolkit, seeded from this app's own
  # Organization & Modulation Sprint audit (see
  # local-notes/completed pile/the_lounge_organization_modulation_sprint_triage.md).
  # Scaffold only as of this line -- no modules migrated in yet, nothing in
  # this app imports it. Path dependency for local development; the package
  # itself has no separate remote yet either.
  flutter_refined_kit:
    path: ../flutter_refined_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  share_plus_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/

dependency_overrides:
  win32: ^5.9.0
  package_info_plus: 8.2.1

